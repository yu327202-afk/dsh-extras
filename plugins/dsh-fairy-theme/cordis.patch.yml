# dsh-fairy-theme bundle patch：在目标 profile 上插一行。
#
# 行的 name 从 profile 自己的 node_modules 解析
# （`dsh plugin --profile <name> add <path>` 装的位置）。
#
# ⚠️ 不要在行里写 `inject: [clientModules]`（2026-09-16 实测踩坑）：
#    clientModules 是 dsh-client-modules 提供的 **host 服务**，只有它自己和
#    dsh-client-hmr 用它；asar 内 9 个 cordis.patch.yml **无一**这样声明。
#    行级 inject 会让本 entry 去等一个它并不需要的服务，导致插件静默不激活。
#    客户端包的依赖请写在 package.json 的 `dsh.client.inject`（另一套语义）。
- insert:
    - id: fairy-theme
      name: 'dsh-fairy-theme'
